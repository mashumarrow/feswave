name: ble_proximity_debug
description: "Foreground BLE proximity measurements between Android devices."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  bluetooth_low_energy: 6.2.1
  path_provider: ^2.1.5
  share_plus: 11.1.0
  wakelock_plus: ^1.4.0
  permission_handler: ^12.0.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
