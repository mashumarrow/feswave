[platformio]
default_envs = left, uno-r4-right

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:left]
build_flags = -DMAPPER_LEFT

[env:right]
build_flags = -DMAPPER_RIGHT

; UNO R4 WiFi's ESP32-S3-MINI-1-N8, connected via native USB.
[env:uno-r4-right]
extends = env:right
board = esp32-s3-devkitm-1
build_flags =
    ${env:right.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
