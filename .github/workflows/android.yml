name: Build demo APK

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'apps/feswave_android/**'
      - '!apps/feswave_android/**/*.md'
      - '!apps/feswave_android/test/**'
      - '!apps/feswave_android/verification/**'
      - '!apps/feswave_android/tool/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/feswave_android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --no-pub --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: feswave-demo-arm64
          path: apps/feswave_android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/flutter-android-app' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: feswave-demo-arm64
      - name: Publish demo APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-debug.apk feswave-demo-arm64.apk
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="android-demo-$GITHUB_RUN_ID"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" feswave-demo-arm64.apk --clobber
          else
            gh release create "$tag" feswave-demo-arm64.apk \
              --target "$GITHUB_SHA" --title "Android demo · $tag" \
              --notes "arm64 debug APK · ${GITHUB_SHA:0:12}" --prerelease
          fi
