name: Android
on:
  push:
    paths: ['apps/feswave_android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/feswave_android/**', '.github/workflows/android.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/feswave_android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build && git diff --exit-code -- lib
      - run: flutter analyze && flutter test && flutter build apk --debug
