name: Release Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/feswave_android/**'
      - '!apps/feswave_android/**/*.md'
      - '!apps/feswave_android/test/**'
      - '!apps/feswave_android/verification/**'
      - '!apps/feswave_android/tool/**'
      - 'cliff.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: git-cliff@2.14.2
      - id: version
        run: |
          latest=$(git tag --list --sort=-v:refname | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | sed -n '1p')
          if git merge-base --is-ancestor HEAD "$latest"; then
            echo "Already released or superseded by $latest"
            exit 0
          fi
          git merge-base --is-ancestor "$latest" HEAD
          cliff=(mise exec git-cliff@2.14.2 -- git-cliff --include-path 'apps/feswave_android/**' --include-path '.github/workflows/release.yml' --include-path 'cliff.toml' --unreleased)
          tag=$("${cliff[@]}" --bumped-version)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$tag" != "$latest" ]]
          "${cliff[@]}" --bump --strip header > release-notes.md
          echo >> release-notes.md
          echo "[Full changelog](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/$latest...$tag)" >> release-notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build_number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.tag != ''
        with:
          name: release-notes
          path: release-notes.md
          overwrite: true

  build:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/feswave_android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub && flutter test --no-pub
      - name: Build and verify signed APK
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          umask 077
          export ANDROID_RELEASE_STORE="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$ANDROID_RELEASE_STORE"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$ANDROID_RELEASE_STORE"
          unset KEYSTORE
          flutter build apk --release --no-pub --target-platform android-arm64 \
            --build-name "${TAG#v}" --build-number "$BUILD_NUMBER" \
            --dart-define=API_BASE_URL=https://feswave-api-933816421570.asia-northeast1.run.app/api/
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/feswave-android-arm64.apk
          cd dist
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$build_tools" verify --print-certs feswave-android-arm64.apk
          sha256sum feswave-android-arm64.apk > feswave-android-arm64.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: apps/feswave_android/dist/
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: actions/download-artifact@v4
        with:
          name: android-arm64
      - name: Publish stable release
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum --check feswave-android-arm64.apk.sha256
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "FESWAVE $TAG" --notes-file release-notes.md
          fi
          draft_target=$(gh release view "$TAG" --json isDraft,targetCommitish --jq 'select(.isDraft) | .targetCommitish')
          if [[ "$draft_target" != "$GITHUB_SHA" ]]; then
            # Resume an interrupted draft only when the new build includes its source.
            [[ "$draft_target" =~ ^[a-f0-9]{40}$ ]]
            gh api "repos/$GH_REPO/compare/$draft_target...$GITHUB_SHA" --jq '.status' | grep -Fx ahead
            gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file release-notes.md
          fi
          gh release upload "$TAG" feswave-android-arm64.apk feswave-android-arm64.apk.sha256 --clobber
          gh release edit "$TAG" --draft=false --prerelease=false --latest
